<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>THE BARDO BARD</title>
<style>
  :root {
    --ink: #d8d8ce;
    --dim: #8a8a80;
    --field: #0a0a0c;
    --accent: #b8c4a8;
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    /* min-height, never height: a fixed-height flex body shrinks #bardo to
       one viewport and traps the sticky doors bar mid-page on long screens. */
    min-height: 100%;
    margin: 0;
    background: var(--field);
    color: var(--ink);
    font-family: "IBM Plex Mono", "Menlo", "Consolas", monospace;
    font-size: clamp(14px, 2.4vw, 17px);
    line-height: 1.55;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #bardo {
    width: 100%;
    max-width: 44rem;
    min-height: 100vh;
    min-height: 100dvh;
    flex-shrink: 0;
    padding: 1.5rem 1.25rem 0;
    display: flex;
    flex-direction: column;
  }
  .screen { flex: 1; }
  .bard-text {
    white-space: pre-wrap;
    font: inherit;
    margin: 0 0 1.75rem;
  }
  .choices { display: flex; flex-direction: column; gap: 0.6rem; align-items: flex-start; }
  button {
    font: inherit;
    background: none;
    border: 1px solid var(--dim);
    color: var(--ink);
    padding: 0.55rem 0.9rem;
    cursor: pointer;
    text-align: left;
    min-height: 44px;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .doors {
    /* Sticky, in normal flow: always visible while scrolling, but reserves its
       own space at the end of the column so it can never cover the last
       choice — a fixed overlay failed the mobile tap-target audit. */
    position: sticky;
    bottom: 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.5rem 0.75rem;
    padding: 0.6rem 0.25rem;
    margin-top: 1.75rem;
    background: color-mix(in srgb, var(--field) 96%, #ffffff);
    border-top: 1px solid #232326;
  }
  .door { font-size: 0.8em; color: var(--dim); border-color: #232326; white-space: nowrap; }
  .door:hover { color: var(--ink); }
  .choice { max-width: 100%; overflow-wrap: break-word; }
  .profile {
    margin-top: 2.25rem;
    border-top: 1px solid #232326;
    padding-top: 1.5rem;
  }
  .vigil-beat { margin-top: 0; }
  .memory { color: var(--accent); opacity: 0.85; }
  .codex-link { display: inline-block; margin-top: 0.5rem; color: var(--dim); font-size: 0.8em; }
  .codex-link:hover { color: var(--accent); }
  a.system { text-decoration: none; display: inline-flex; align-items: center; border: 1px solid #232326; padding: 0.55rem 0.9rem; min-height: 44px; }
  .audio-toggle { position: fixed; top: 0.5rem; right: 0.5rem; z-index: 10; background: var(--field); font-size: 0.7em; }
  .ack { color: var(--dim); }
  .ledger-reveal, .full-ledger { color: var(--dim); font-size: 0.85em; }
  .blot-wrap { display: flex; justify-content: center; margin: 0.25rem 0 1.5rem; color: #80807a; }
  .blot {
    font: inherit;
    font-size: clamp(7px, 2.8vw, 12px);
    line-height: 1.08;
    letter-spacing: 0.08em;
    margin: 0;
    user-select: none;
  }
  .sigil-wrap { margin: 2.25rem auto 0; width: min(9.5rem, 55%); color: var(--accent); }
  .sigil-wrap svg { width: 100%; height: auto; display: block; }
  .system-note { font-size: 0.7em; color: var(--dim); max-width: 22rem; }
  .glyph-block {
    font: inherit;
    font-size: 0.85em;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    border: 1px dashed #232326;
    padding: 0.75rem;
    margin: 0;
    max-width: 100%;
  }
  @media (prefers-reduced-motion: no-preference) {
    .sigil-particle { animation: sigil-pulse 2.6s ease-in-out infinite; }
    @keyframes sigil-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  }
  .system-row { margin-top: 1.5rem; display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
  .system { font-size: 0.8em; color: var(--dim); border-color: #232326; }
  .system:hover { color: var(--ink); }
  .totenpass-token {
    font: inherit;
    font-size: 0.75em;
    color: var(--accent);
    max-width: 100%;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
    border: 1px dashed #232326;
    padding: 0.6rem;
    margin: 0;
  }
  .totenpass-input {
    font: inherit;
    font-size: 0.8em;
    background: none;
    border: 1px solid var(--dim);
    color: var(--ink);
    padding: 0.5rem 0.7rem;
    min-height: 44px;
    flex: 1;
    min-width: 10rem;
  }
  .crisis {
    width: 100%;
    text-align: center;
    font-size: 0.72em;
    color: var(--dim);
    padding: 1.25rem 1rem 1.5rem;
  }
  .crisis a { color: inherit; }
  .profile-rule { color: var(--dim); letter-spacing: 0.2em; margin: 0 0 1rem; }
  .profile-title { font-size: 1.1em; font-weight: 600; color: var(--accent); margin: 0 0 1rem; }
  .profile-body { margin: 0 0 1.25rem; }
  .profile-dim { color: var(--dim); margin: 0 0 0.9rem; }
  @media (prefers-reduced-motion: no-preference) {
    .bard-text { animation: settle 240ms ease-out; }
    @keyframes settle { from { opacity: 0; } to { opacity: 1; } }
  }
</style>
</head>
<body>
<div id="bardo"></div>
<script src="./bardo.js"></script>
</body>
</html>
