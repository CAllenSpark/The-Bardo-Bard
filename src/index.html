<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>THE BARDO BARD</title>
<style>
  :root {
    --ink: #d8d8ce;
    --dim: #8a8a80;
    --field: #0a0a0c;
    --accent: #b8c4a8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--field);
    color: var(--ink);
    font-family: "IBM Plex Mono", "Menlo", "Consolas", monospace;
    font-size: clamp(14px, 2.4vw, 17px);
    line-height: 1.55;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #bardo {
    width: 100%;
    max-width: 44rem;
    min-height: 100%;
    padding: 1.5rem 1.25rem 0;
    display: flex;
    flex-direction: column;
  }
  .screen { flex: 1; }
  .bard-text {
    white-space: pre-wrap;
    font: inherit;
    margin: 0 0 1.75rem;
  }
  .choices { display: flex; flex-direction: column; gap: 0.6rem; align-items: flex-start; }
  button {
    font: inherit;
    background: none;
    border: 1px solid var(--dim);
    color: var(--ink);
    padding: 0.55rem 0.9rem;
    cursor: pointer;
    text-align: left;
    min-height: 44px;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .doors {
    /* Sticky, in normal flow: always visible while scrolling, but reserves its
       own space at the end of the column so it can never cover the last
       choice — a fixed overlay failed the mobile tap-target audit. */
    position: sticky;
    bottom: 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.5rem 0.75rem;
    padding: 0.6rem 0.25rem;
    margin-top: 1.75rem;
    background: color-mix(in srgb, var(--field) 96%, #ffffff);
    border-top: 1px solid #232326;
  }
  .door { font-size: 0.8em; color: var(--dim); border-color: #232326; white-space: nowrap; }
  .door:hover { color: var(--ink); }
  .choice { max-width: 100%; overflow-wrap: break-word; }
  .profile {
    margin-top: 2.25rem;
    border-top: 1px solid #232326;
    padding-top: 1.5rem;
  }
  .profile-rule { color: var(--dim); letter-spacing: 0.2em; margin: 0 0 1rem; }
  .profile-title { font-size: 1.1em; font-weight: 600; color: var(--accent); margin: 0 0 1rem; }
  .profile-body { margin: 0 0 1.25rem; }
  .profile-dim { color: var(--dim); margin: 0 0 0.9rem; }
  @media (prefers-reduced-motion: no-preference) {
    .bard-text { animation: settle 240ms ease-out; }
    @keyframes settle { from { opacity: 0; } to { opacity: 1; } }
  }
</style>
</head>
<body>
<div id="bardo"></div>
<script src="./bardo.js"></script>
</body>
</html>
