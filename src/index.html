<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>THE BARDO BARD</title>
<style>
  :root {
    --ink: #d8d8ce;
    --dim: #8a8a80;
    --field: #0a0a0c;
    --accent: #b8c4a8;
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    /* The desk is a fixed stage now (CD 2026-07-16): the viewport does not
       scroll — the entity is pinned in view and the text/choices scroll within
       their own box. body is the whole stage; #bardo fills it, the crisis line
       pins beneath. */
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    margin: 0;
    background: var(--field);
    color: var(--ink);
    font-family: "IBM Plex Mono", "Menlo", "Consolas", monospace;
    font-size: clamp(14px, 2.4vw, 17px);
    line-height: 1.55;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #bardo {
    width: 100%;
    max-width: 44rem;
    flex: 1;
    min-height: 0;
    padding: 1rem 1.25rem 0;
    display: flex;
    flex-direction: column;
  }
  /* The scroll box: text and choices live here and scroll; the entity above and
     the crisis line below stay put. Glowing cues appear when there is more. */
  .scroll-region { position: relative; flex: 1; min-height: 0; display: flex; }
  #stage {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    scrollbar-color: #303034 transparent;
  }
  #stage::-webkit-scrollbar { width: 8px; }
  #stage::-webkit-scrollbar-thumb { background: #303034; border-radius: 4px; }
  .scroll-cue {
    position: absolute;
    left: 0; right: 0;
    height: 2.4rem;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 1.1rem;
    color: var(--accent);
    pointer-events: none;
    opacity: 0;
    transition: opacity 320ms ease;
    z-index: 5;
    text-shadow: 0 0 8px color-mix(in srgb, var(--accent) 70%, transparent);
  }
  .scroll-cue.up { top: 0; background: linear-gradient(to bottom, var(--field), transparent); }
  .scroll-cue.down { bottom: 0; background: linear-gradient(to top, var(--field), transparent); }
  .scroll-region.can-up .scroll-cue.up,
  .scroll-region.can-down .scroll-cue.down { opacity: 0.9; pointer-events: auto; cursor: pointer; }
  @media (prefers-reduced-motion: no-preference) {
    .scroll-region.can-up .scroll-cue.up,
    .scroll-region.can-down .scroll-cue.down { animation: cue-glow 1.8s ease-in-out infinite; }
    @keyframes cue-glow { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.95; } }
  }
  .screen { min-height: min-content; }
  .bard-text {
    white-space: pre-wrap;
    font: inherit;
    margin: 0 0 1.75rem;
  }
  .choices { display: flex; flex-direction: column; gap: 0.6rem; align-items: flex-start; }
  button {
    font: inherit;
    background: none;
    border: 1px solid var(--dim);
    color: var(--ink);
    padding: 0.55rem 0.9rem;
    cursor: pointer;
    text-align: left;
    min-height: 44px;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .doors {
    /* End of the scroll content (the entity is pinned above, so the doors no
       longer need to be sticky; the glowing down-cue signals them when the
       screen is long). */
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.5rem 0.75rem;
    padding: 0.6rem 0.25rem;
    margin-top: 1.75rem;
    background: color-mix(in srgb, var(--field) 96%, #ffffff);
    border-top: 1px solid #232326;
  }
  .door { font-size: 0.8em; color: var(--dim); border-color: #232326; white-space: nowrap; }
  .door:hover { color: var(--ink); }
  .choice { max-width: 100%; overflow-wrap: break-word; }
  .profile {
    margin-top: 2.25rem;
    border-top: 1px solid #232326;
    padding-top: 1.5rem;
  }
  .vigil-beat { margin-top: 0; }
  .memory { color: var(--accent); opacity: 0.85; }
  .codex-link { display: inline-block; margin-top: 0.5rem; color: var(--dim); font-size: 0.8em; }
  .codex-link:hover { color: var(--accent); }
  a.system { text-decoration: none; display: inline-flex; align-items: center; border: 1px solid #232326; padding: 0.55rem 0.9rem; min-height: 44px; }
  .audio-toggle { position: fixed; top: 0.5rem; right: 0.5rem; z-index: 10; background: var(--field); font-size: 0.7em; }
  .ack { color: var(--dim); }
  .ledger-reveal, .full-ledger { color: var(--dim); font-size: 0.85em; }
  .blot-wrap {
    /* THE BARD — the dominant zone (CD mockup 2026-07-14), now pinned in view
       above the scroll box (CD 2026-07-16) so it can never scroll away. */
    position: relative;
    height: clamp(10rem, 34vh, 19rem);
    flex-shrink: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0 0 1rem;
    color: #80807a;
  }
  /* The entity claiming the whole browser as its stage (a transition flourish). */
  .blot-wrap.stage-full {
    position: fixed;
    inset: 0;
    height: auto;
    margin: 0;
    z-index: 40;
  }
  .blot-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .blot {
    /* text body fallback (no 2D context) — same face, smaller voice */
    font: inherit;
    font-size: clamp(4px, 1.4vw, 9px);
    line-height: 1.05;
    letter-spacing: 0.06em;
    margin: 0;
    user-select: none;
  }
  .sigil-wrap { margin: 2.25rem auto 0; width: min(9.5rem, 55%); color: var(--accent); }
  .sigil-wrap svg { width: 100%; height: auto; display: block; }
  .system-note { font-size: 0.7em; color: var(--dim); max-width: 22rem; }
  .glyph-block {
    font: inherit;
    font-size: 0.85em;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    border: 1px dashed #232326;
    padding: 0.75rem;
    margin: 0;
    max-width: 100%;
  }
  @media (prefers-reduced-motion: no-preference) {
    .sigil-particle { animation: sigil-pulse 2.6s ease-in-out infinite; }
    @keyframes sigil-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  }
  .system-row { margin-top: 1.5rem; display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
  .system { font-size: 0.8em; color: var(--dim); border-color: #232326; }
  .system:hover { color: var(--ink); }
  .totenpass-token {
    font: inherit;
    font-size: 0.75em;
    color: var(--accent);
    max-width: 100%;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
    border: 1px dashed #232326;
    padding: 0.6rem;
    margin: 0;
  }
  .totenpass-input {
    font: inherit;
    font-size: 0.8em;
    background: none;
    border: 1px solid var(--dim);
    color: var(--ink);
    padding: 0.5rem 0.7rem;
    min-height: 44px;
    flex: 1;
    min-width: 10rem;
  }
  .crisis {
    flex-shrink: 0;
    width: 100%;
    max-width: 44rem;
    text-align: center;
    font-size: 0.68em;
    line-height: 1.5;
    color: var(--dim);
    padding: 0.5rem 1rem 0.7rem;
  }
  .crisis a { color: inherit; }
  /* CONTINUE — begin the next life. Prominent, centered, the turn of the loop. */
  .continue-row { display: flex; justify-content: center; margin: 2.5rem 0 1.5rem; }
  .continue {
    font-size: 1em;
    letter-spacing: 0.14em;
    color: var(--accent);
    border-color: var(--accent);
    padding: 0.7rem 2rem;
    text-align: center;
  }
  .continue:hover { background: color-mix(in srgb, var(--accent) 16%, transparent); }
  /* The rebirth: the screen goes to light between one life and the next. */
  .rebirth {
    position: fixed;
    inset: 0;
    background: #f2f1ea;
    opacity: 0;
    pointer-events: none;
    z-index: 60;
  }
  @media (prefers-reduced-motion: no-preference) {
    .rebirth { transition: opacity 850ms ease; }
    .rebirth.rising { opacity: 1; }
  }
  .profile-rule { color: var(--dim); letter-spacing: 0.2em; margin: 0 0 1rem; }
  .profile-title { font-size: 1.1em; font-weight: 600; color: var(--accent); margin: 0 0 1rem; }
  .profile-body { margin: 0 0 1.25rem; }
  .profile-dim { color: var(--dim); margin: 0 0 0.9rem; }
  @media (prefers-reduced-motion: no-preference) {
    .bard-text { animation: settle 240ms ease-out; }
    @keyframes settle { from { opacity: 0; } to { opacity: 1; } }
  }
</style>
</head>
<body>
<div id="bardo"></div>
<script src="./bardo.js"></script>
</body>
</html>
