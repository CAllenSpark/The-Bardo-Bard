<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>THE BARDO BARD</title>
<style>
  :root {
    --ink: #d8d8ce;
    --dim: #8a8a80;
    --field: #0a0a0c;
    --accent: #b8c4a8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--field);
    color: var(--ink);
    font-family: "IBM Plex Mono", "Menlo", "Consolas", monospace;
    font-size: clamp(14px, 2.4vw, 17px);
    line-height: 1.55;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #bardo {
    width: 100%;
    max-width: 44rem;
    min-height: 100%;
    padding: 1.5rem 1.25rem 5.5rem;
    display: flex;
    flex-direction: column;
  }
  .screen { flex: 1; }
  .bard-text {
    white-space: pre-wrap;
    font: inherit;
    margin: 0 0 1.75rem;
  }
  .choices { display: flex; flex-direction: column; gap: 0.6rem; align-items: flex-start; }
  button {
    font: inherit;
    background: none;
    border: 1px solid var(--dim);
    color: var(--ink);
    padding: 0.55rem 0.9rem;
    cursor: pointer;
    text-align: left;
    min-height: 44px;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .doors {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    display: flex;
    justify-content: center;
    gap: 0.75rem;
    padding: 0.75rem 1rem;
    background: color-mix(in srgb, var(--field) 88%, transparent);
    border-top: 1px solid #232326;
  }
  .door { font-size: 0.85em; color: var(--dim); border-color: #232326; }
  .door:hover { color: var(--ink); }
  @media (prefers-reduced-motion: no-preference) {
    .bard-text { animation: settle 240ms ease-out; }
    @keyframes settle { from { opacity: 0; } to { opacity: 1; } }
  }
</style>
</head>
<body>
<div id="bardo"></div>
<script src="./bardo.js"></script>
</body>
</html>
